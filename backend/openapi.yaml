openapi: 3.1.0
info:
  title: Bahasa Master API
  version: 1.0.0
  description: Contract for the Bahasa Master mobile application.
servers:
  - url: http://localhost:8080/v1
    description: Local development
paths:
  /anki/import/preview:
    post:
      summary: Preview an APKG, CSV, or Bahasa Master JSON deck without saving it
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: Maximum 20 MiB and 10000 cards}
      responses:
        '200': {description: Metadata, first three cards, media count, and SHA-256 in data envelope}
        '401': {description: Authentication required}
        '402': {description: Premium level requires lifetime entitlement}
        '413': {description: File too large}
        '422': {description: Unsupported or invalid deck}
        '429': {description: Transfer capacity busy}
  /anki/import:
    post:
      summary: Create a private deck including bundled media and a fresh SRS schedule
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, sha256, requestId]
              properties:
                file: {type: string, format: binary}
                title: {type: string, maxLength: 140}
                sha256: {type: string, description: Digest from preview}
                requestId: {type: string, format: uuid, description: Stable across retries; returns the original deck}
      responses:
        '201': {description: Private deck details in data envelope}
        '401': {description: Authentication required}
        '402': {description: Premium level requires lifetime entitlement}
        '409': {description: File digest changed since preview}
        '413': {description: File too large}
        '422': {description: Invalid content or account storage limit exceeded}
        '429': {description: Transfer capacity busy}
  /anki/decks/{deckID}/export:
    parameters:
      - {in: path, name: deckID, required: true, schema: {type: string}}
    get:
      summary: Download all deck cards, up to 10000, with bundled media for APKG or JSON
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: format, schema: {type: string, enum: [apkg, csv, json], default: apkg}}
      responses:
        '200':
          description: Private download with Content-Disposition; review history excluded
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            text/csv:
              schema: {type: string}
            application/json:
              schema: {type: object}
        '401': {description: Authentication required}
        '402': {description: Premium deck requires lifetime entitlement}
        '404': {description: Deck not found or owned by another account}
        '422': {description: Unsupported format or export limit exceeded}
        '429': {description: Transfer capacity busy}
  /anki/decks/{deckID}:
    parameters:
      - {in: path, name: deckID, required: true, schema: {type: string}}
    get:
      summary: Deck metadata and previews; private deck ownership is enforced
      responses:
        '200': {description: Deck details in data envelope}
        '404': {description: Deck not found}
    delete:
      summary: Delete an owned personal deck, media, and review schedule
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Deleted in data envelope}
        '401': {description: Authentication required}
        '404': {description: Deck not found or not owned}
  /anki/decks/{deckID}/media/{name}:
    parameters:
      - {in: path, name: deckID, required: true, schema: {type: string}}
      - {in: path, name: name, required: true, schema: {type: string}}
    get:
      summary: Read a bundled image or audio after account ownership and entitlement checks
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Raw image/audio bytes with private no-store and nosniff headers}
        '401': {description: Authentication required}
        '402': {description: Premium entitlement required}
        '404': {description: Deck or media not found or not owned}
  /admin/notifications:
    get:
      summary: List private announcement drafts/history and sender configuration state (admin bearer key)
      responses:
        '200': {description: Announcement history; requires NOTIFICATIONS_ADMIN_TOKEN or branding admin key}
        '401': {description: Invalid admin key}
    post:
      summary: Save an announcement draft without sending it (admin bearer key)
      responses:
        '201': {description: Draft saved with generated ID}
        '401': {description: Invalid admin key}
        '422': {description: Invalid title/body/allowed internal route or oversized topic message}
  /admin/notifications/{id}:
    put:
      summary: Edit a draft or explicitly reopen a definitively rejected message (admin bearer key)
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200': {description: Draft saved}
        '409': {description: Sent or uncertain message cannot be edited or retried}
  /admin/notifications/{id}/send:
    post:
      summary: Dispatch a saved draft once to the public Bahasa announcement topic
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmId]
              properties:
                confirmId: {type: string, description: Must match the saved draft ID}
      responses:
        '200': {description: Persisted result (sent, failed, or uncertain); sent means FCM acceptance, not device receipt}
        '409': {description: Message already processed; duplicate dispatch blocked}
        '503': {description: FCM sender not configured}
  /admin/notifications/check:
    post:
      summary: Validate FCM access without sending a notification (validate_only)
      responses:
        '200': {description: Sender validated; no broadcast sent}
        '502': {description: Firebase rejected validation or connection failed}
        '503': {description: FCM sender not configured}

  /app-update-policy:
    get:
      tags: [App updates]
      summary: Get public Android and iOS minimum build and OS requirements before login
      security: []
      responses:
        '200':
          description: 'data.android and data.ios contain enabled, minimumBuild (0 disables forced updates), latestBuild, latestVersion, minimumAndroidApi, minimumIOSVersion, storeUrl, unsupportedDevicePolicy (allow/block), message. Cache-Control no-store.'
  /admin/app-update-policy:
    put:
      tags: [App updates]
      summary: Save durable update requirements; requires APP_UPDATE_ADMIN_TOKEN or the configured branding admin token
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [android, ios]
              properties:
                android: {type: object}
                ios: {type: object}
      responses:
        '200': {description: Validated policy saved atomically and applied immediately}
        '401': {description: Invalid or disabled admin token}
        '422': {description: Invalid minimum build, OS version, or platform-specific store URL}
        '500': {description: Policy could not be saved; previous policy remains active}
  /admin/pricing:
    get:
      tags: [Subscription]
      summary: Load configured in-app display price (admin bearer key)
      security: [{adminBearerAuth: []}]
      responses:
        '200': {description: Current IDR display price}
        '401': {description: Invalid or disabled admin token}
    put:
      tags: [Subscription]
      summary: Save durable lifetime display price; store-console prices remain manual
      security: [{adminBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PricingConfig'}
      responses:
        '200': {description: Price saved and applied immediately}
        '401': {description: Invalid or disabled admin token}
        '422': {description: 'Price must be between IDR 1,000 and 100,000,000'}
        '500': {description: Price could not be saved; previous price remains active}
  /pricing:
    get:
      tags: [Subscription]
      summary: Get the current lifetime display price in IDR
      security: []
      responses:
        '200': {description: Public pricing configuration; Cache-Control no-store}
  /billing:
    get:
      tags: [Billing]
      summary: Get lifetime product ID, opaque account binding, configured platforms and verified entitlement
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Billing account includes configured display priceIdr, entitlement and (when configured) an account-bound Ed25519 offlineLease JWT expiring 30 days after its last authoritative store verification}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Store revalidation unavailable}
  /billing/verify:
    post:
      tags: [Billing]
      summary: Verify one-time lifetime purchase with Google Play or App Store and bind one app account
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, productId, verificationData]
              properties:
                platform: {type: string, enum: [android, ios]}
                productId: {type: string, example: bahasa_master_lifetime}
                verificationData: {type: string, description: Google purchase token or Apple StoreKit 2 signed JWS}
                transactionId: {type: string}
      responses:
        '200': {description: Verified purchased or revoked state, current entitlement, and a signed offlineLease when the purchase is currently active}
        '202': {description: Pending payment; no entitlement granted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {description: Transaction belongs to another active app account}
        '422': {description: Invalid proof, product, platform, or account binding}
        '503': {description: Store verifier unavailable; retry without repurchasing}
  /billing/notifications/google:
    post:
      tags: [Billing]
      summary: Receive authenticated Google Pub/Sub RTDN; re-fetch authoritative store state
      responses:
        '204': {description: Notification processed}
        '401': {description: Invalid Pub/Sub OIDC audience or service account identity}
        '503': {description: Temporary store failure; Pub/Sub should retry}
  /billing/notifications/apple:
    post:
      tags: [Billing]
      summary: Receive App Store Server Notifications V2 with verified Apple signedPayload
      responses:
        '204': {description: Notification processed}
        '422': {description: Invalid signed notification}
        '503': {description: Temporary store failure; Apple should retry}
  /me/account:
    delete:
      tags: [Profile]
      summary: Permanently delete account and personal learning data; detach purchase for legitimate store restore
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: {type: string, enum: [DELETE]}
      responses:
        '204': {description: Account deleted and sessions revoked; does not request store refund}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {description: Missing explicit confirmation}
  /assets/images/{category}/{filename}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [Assets]
      summary: Public learning image served outside the mobile bundle
      parameters:
        - in: path
          name: category
          required: true
          schema: {type: string, enum: [reading, vocabulary]}
        - in: path
          name: filename
          required: true
          schema: {type: string, pattern: '\.webp$'}
      responses:
        '200':
          description: WebP image; cached for one day
          content:
            image/png:
              schema: {type: string, format: binary}
        '404':
          description: Image unavailable or path disallowed
  /branding:
    get:
      tags: [Branding]
      summary: Public application branding (empty image URLs use bundled defaults)
      responses:
        '200':
          description: Branding settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Branding'}
  /admin/branding:
    put:
      tags: [Branding]
      summary: Replace durable branding using BRANDING_ADMIN_TOKEN (not a user session)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Branding'}
      responses:
        '200': {description: Settings saved}
        '401': {description: Missing or incorrect admin token}
        '422': {description: Invalid name, image URL or color}
        '500': {description: Settings could not be persisted}
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200': {$ref: '#/components/responses/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/google:
    post:
      tags: [Authentication]
      summary: Exchange a Google ID token
      parameters:
        - in: header
          name: X-Device-Timezone
          required: false
          description: IANA timezone saved for a newly created account; ignored for returning accounts
          schema: {type: string, maxLength: 64, example: America/Los_Angeles}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: {type: string}
      responses:
        '200': {$ref: '#/components/responses/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /home:
    get:
      parameters:
        - {$ref: '#/components/parameters/AcceptLanguage'}
      tags: [Home]
      summary: Get the complete home dashboard
      description: Includes enabled backend-managed carousel banners. A valid optional bearer token adds personal profile, daily goal, and achievements.
      security: [{}, {bearerAuth: []}]
      responses:
        '200':
          headers:
            Content-Language: {$ref: '#/components/headers/ContentLanguage'}
          description: Guest or authenticated dashboard
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Dashboard'}
  /admin/home-banners:
    get:
      tags: [Home]
      summary: Read carousel settings including disabled banners
      security: [{adminBearerAuth: []}]
      responses:
        '200':
          description: Current banner settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/HomeBannerConfig'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      tags: [Home]
      summary: Persist carousel content, images, order, and visibility
      security: [{adminBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HomeBannerConfig'}
      responses:
        '200':
          description: Saved banner settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/HomeBannerConfig'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {description: Invalid banner content or image reference}
        '500': {description: Settings could not be persisted; live settings unchanged}
  /admin/home-banners/images:
    post:
      tags: [Home]
      summary: Upload a PNG or JPEG for a home banner
      description: Maximum 5 MiB and 12 million pixels. Save the returned root-relative imageUrl in a banner to publish it.
      security: [{adminBearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, format: binary}
      responses:
        '201':
          description: Image saved to durable storage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imageUrl: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {description: Upload exceeds the size limit}
        '422': {description: Unsupported, corrupt, or oversized image dimensions}
  /learning/categories:
    get:
      parameters:
        - {$ref: '#/components/parameters/AcceptLanguage'}
      tags: [Learning]
      responses:
        '200': {$ref: '#/components/responses/Categories'}
  /learning/tracks:
    get:
      tags: [Learning]
      parameters:
        - {$ref: '#/components/parameters/AcceptLanguage'}
        - {$ref: '#/components/parameters/System'}
      responses:
        '200': {$ref: '#/components/responses/Tracks'}
  /plans:
    get:
      tags: [Subscription]
      responses:
        '200': {$ref: '#/components/responses/Plans'}
  /me/profile:
    get:
      tags: [Profile]
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Profile]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, target]
              properties:
                displayName: {type: string}
                target: {type: string, example: JLPT N3}
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/profile/photo:
    post:
      tags: [Profile]
      summary: Compress and upload the signed-in user's profile photo to Tencent COS
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: {type: string, format: binary, description: 'JPEG, PNG, or GIF; maximum 8 MB'}
      responses:
        '200': {description: Profile with updated photoUrl; backend resizes to at most 512 px, re-encodes as JPEG, and strips image metadata before COS upload}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {description: Upload exceeds 8 MB}
        '422': {description: Invalid or unsupported image}
        '502': {description: COS upload failed}
        '503': {description: COS upload credentials or public URL are unavailable}
  /me/timezone:
    put:
      tags: [Profile]
      summary: Update the signed-in user's study timezone
      description: Stores an IANA timezone identifier used to calculate daily progress and streak boundaries. Existing accounts keep Asia/Jakarta until this endpoint is called.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [timezone]
              properties:
                timezone: {type: string, minLength: 1, maxLength: 64, example: Europe/Paris}
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '400':
          description: Invalid JSON request body
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422':
          description: Timezone is not a recognized IANA timezone
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Timezone could not be persisted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /me/learning-history:
    get:
      tags: [Learning]
      summary: Recently opened learning materials, newest first, isolated per account
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 'data.items contains kind, lessonId, title, level, zero-based position, total, completed, locked, available, and accessedAt (UTC). Metadata and completion are server-derived. Cache-Control is no-store.'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/learning-history/{kind}/{lessonId}:
    put:
      tags: [Learning]
      summary: Save the last successfully opened material position without awarding quiz progress or XP
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: kind
          required: true
          schema: {type: string, enum: [vocabulary, grammar, reading]}
        - in: path
          name: lessonId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [position, accessedAt]
              properties:
                position: {type: integer, minimum: 0, description: Must be less than the current material count}
                accessedAt: {type: string, format: date-time, description: UTC access time; timestamps over five minutes in the future are rejected. Older updates cannot replace a newer position.}
      responses:
        '200': {description: Canonical saved activity; stale retries return the newer stored activity}
        '400': {description: Invalid position or timestamp}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Premium material requires an active entitlement}
        '404': {description: Material or learning category not found}
  /me/progress:
    get:
      tags: [Profile]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Lesson progress list}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/progress/{lessonId}:
    put:
      tags: [Profile]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: lessonId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completion, lastPosition]
              properties:
                completion: {type: integer, minimum: 0, maximum: 100}
                lastPosition: {type: integer, minimum: 0}
      responses:
        '200': {description: Progress saved}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/gamification:
    get:
      tags: [Profile]
      summary: Server-verified XP, level, Jakarta daily streak, and permanent achievements
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current account summary; fresh accounts have zero XP and locked achievements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/GamificationSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/achievements:
    get:
      tags: [Profile]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Achievement list}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /vocabulary/levels:
    get:
      parameters:
        - {$ref: '#/components/parameters/AcceptLanguage'}
      tags: [Vocabulary]
      summary: List vocabulary levels, lessons, and user progress
      security: [{bearerAuth: []}]
      responses:
        '200':
          headers:
            Content-Language: {$ref: '#/components/headers/ContentLanguage'}
          description: Vocabulary course catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/VocabularyLevel'}
        '401': {$ref: '#/components/responses/LocalizedUnauthorized'}
  /vocabulary/lessons/{lessonId}:
    get:
      tags: [Vocabulary]
      summary: Get teaching content for a vocabulary lesson
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AcceptLanguage'}
        - {$ref: '#/components/parameters/LessonId'}
      responses:
        '200':
          headers:
            Content-Language: {$ref: '#/components/headers/ContentLanguage'}
          description: Lesson and vocabulary words
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/VocabularyLesson'}
        '401': {$ref: '#/components/responses/LocalizedUnauthorized'}
        '404': {description: Lesson not found, headers: {Content-Language: {$ref: '#/components/headers/ContentLanguage'}}}
  /vocabulary/lessons/{lessonId}/attempts:
    post:
      tags: [Vocabulary]
      summary: Start or retry a server-evaluated lesson quiz
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AcceptLanguage'}
        - {$ref: '#/components/parameters/LessonId'}
      responses:
        '201':
          headers:
            Content-Language: {$ref: '#/components/headers/ContentLanguage'}
          description: New attempt with questions; correct answers are withheld
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [id, lessonId, questions, startedAt]
                    properties:
                      id: {type: string}
                      lessonId: {type: string}
                      startedAt: {type: string, format: date-time}
                      questions: {type: array, items: {$ref: '#/components/schemas/VocabularyQuestion'}}
        '401': {$ref: '#/components/responses/LocalizedUnauthorized'}
        '404': {description: Lesson not found, headers: {Content-Language: {$ref: '#/components/headers/ContentLanguage'}}}
  /vocabulary/attempts/{attemptId}/answers:
    post:
      tags: [Vocabulary]
      summary: Submit one answer and receive educational feedback
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AcceptLanguage'}
        - {$ref: '#/components/parameters/AttemptId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, optionId]
              properties:
                questionId: {type: string}
                optionId: {type: string}
      responses:
        '200':
          headers:
            Content-Language: {$ref: '#/components/headers/ContentLanguage'}
          description: Correctness, correct option, and explanation
        '401': {$ref: '#/components/responses/LocalizedUnauthorized'}
        '404': {description: Attempt not found or not owned by user, headers: {Content-Language: {$ref: '#/components/headers/ContentLanguage'}}}
        '422': {description: Invalid question or option, headers: {Content-Language: {$ref: '#/components/headers/ContentLanguage'}}}
  /vocabulary/attempts/{attemptId}/complete:
    post:
      tags: [Vocabulary]
      summary: Complete an attempt and persist best score/progress
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AcceptLanguage'}
        - {$ref: '#/components/parameters/AttemptId'}
      responses:
        '200':
          headers:
            Content-Language: {$ref: '#/components/headers/ContentLanguage'}
          description: Score, pass status, best score, and total progress
        '401': {$ref: '#/components/responses/LocalizedUnauthorized'}
        '404': {description: Attempt not found or not owned by user, headers: {Content-Language: {$ref: '#/components/headers/ContentLanguage'}}}
        '422': {description: Not all questions have been answered, headers: {Content-Language: {$ref: '#/components/headers/ContentLanguage'}}}
  /offline/practice/{kind}/{lessonId}:
    get:
      tags: [Learning]
      summary: Get an authenticated, signed snapshot of one lesson quiz
      description: The package contains practice feedback answers for offline use. It is versioned by content hash and bound to the authenticated account. Currently only kind vocabulary is served; the kind uses a lesson ID.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AcceptLanguage'}
        - in: path
          name: kind
          required: true
          schema: {type: string, enum: [vocabulary]}
        - in: path
          name: lessonId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Signed question bank with practice feedback, headers: {Content-Language: {$ref: '#/components/headers/ContentLanguage'}}}
        '401': {$ref: '#/components/responses/LocalizedUnauthorized'}
        '402': {description: Premium access required for premium-level lessons, headers: {Content-Language: {$ref: '#/components/headers/ContentLanguage'}}}
        '404': {description: Lesson or practice questions not found, headers: {Content-Language: {$ref: '#/components/headers/ContentLanguage'}}}
        '503': {description: Offline package signing is not configured, headers: {Content-Language: {$ref: '#/components/headers/ContentLanguage'}}}
  /offline/practice-attempts/sync:
    post:
      tags: [Learning]
      summary: Idempotently sync an offline lesson attempt for authoritative server scoring
      description: Validates the account-bound signed package and recomputes the score from selected option IDs. Lessons update best score, pass, XP and achievements.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attemptId, package, answers]
              properties:
                attemptId: {type: string, format: uuid}
                package: {type: object, description: The complete immutable package returned by the GET endpoint}
                answers:
                  type: array
                  items:
                    type: object
                    required: [questionId, optionId]
                    properties:
                      questionId: {type: string}
                      optionId: {type: string}
      responses:
        '200': {description: Authoritative verified result; duplicate attempt IDs return the original result}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {description: Premium access required for premium-level lessons}
        '422': {description: Invalid signature, package, or answers}
        '503': {description: Offline package signing is not configured}
components:
  securitySchemes:
    adminBearerAuth: {type: http, scheme: bearer, description: Backend admin key (feature-specific admin token or BRANDING_ADMIN_TOKEN)}
    bearerAuth: {type: http, scheme: bearer, bearerFormat: opaque-session-token}
  parameters:
    System:
      in: query
      name: system
      schema: {type: string}
    LessonId:
      in: path
      name: lessonId
      required: true
      schema: {type: string}
    AttemptId:
      in: path
      name: attemptId
      required: true
      schema: {type: string}
    AcceptLanguage:
      in: header
      name: Accept-Language
      description: Preferred response language. The server supports Indonesian and English and may fall back to Indonesian when English is not enabled.
      required: false
      schema: {type: string, example: "en-US,en;q=0.9"}
  headers:
    ContentLanguage:
      description: The response language selected by the server; English may fall back to Indonesian while its release gate is closed.
      schema: {type: string, enum: [id, en]}
  responses:
    AuthSession:
      description: Authenticated session
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  token: {type: string}
                  user: {$ref: '#/components/schemas/Profile'}
    Profile:
      description: User profile
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {$ref: '#/components/schemas/Profile'}
    Categories:
      headers:
        Content-Language: {$ref: '#/components/headers/ContentLanguage'}
      description: Learning categories
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CategoriesResponse'}
    Tracks:
      headers:
        Content-Language: {$ref: '#/components/headers/ContentLanguage'}
      description: Learning tracks
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TracksResponse'}
    Exams:
      headers:
        Content-Language: {$ref: '#/components/headers/ContentLanguage'}
      description: Exams
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ExamsResponse'}
    Plans:
      description: Subscription plans
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlansResponse'}
    Unauthorized:
      description: Missing, invalid, or revoked token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PremiumRequired:
      headers:
        Content-Language: {$ref: '#/components/headers/ContentLanguage'}
      description: Premium entitlement required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    LocalizedUnauthorized:
      description: Missing, invalid, or revoked token
      headers:
        Content-Language: {$ref: '#/components/headers/ContentLanguage'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    Branding:
      type: object
      required: [appName, tagline, iconUrl, splashUrl, backgroundColor]
      properties:
        appName: {type: string, minLength: 1, maxLength: 50}
        tagline: {type: string, maxLength: 120}
        iconUrl: {type: string, description: Public HTTPS PNG/JPG URL or empty for default}
        splashUrl: {type: string, description: Public HTTPS portrait PNG/JPG URL or empty for default}
        backgroundColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$', example: '#FAFAFA'}
    VocabularyLevel:
      type: object
      required: [level, title, description, requiredTier, progress, lessons]
      properties:
        level: {type: string, enum: [N5, N4, N3, N2, N1]}
        title: {type: string}
        description: {type: string}
        sourceName: {type: string, description: Attribution source when vocabulary data is adapted from an external dataset}
        sourceUrl: {type: string, format: uri, description: Link to the original vocabulary dataset}
        sourceLicense: {type: string, description: License and adaptation note for attributed vocabulary data}
        requiredTier: {type: string, enum: [free, premium]}
        progress: {type: integer, minimum: 0, maximum: 100}
        lessons:
          type: array
          items: {$ref: '#/components/schemas/VocabularyLessonSummary'}
    VocabularyLessonSummary:
      type: object
      required: [id, order, title, description, wordCount, bestScore, completed]
      properties:
        id: {type: string}
        order: {type: integer, minimum: 1}
        title: {type: string}
        description: {type: string}
        wordCount: {type: integer, minimum: 1}
        questionCount: {type: integer, minimum: 1}
        imageAsset: {type: string}
        imageUrl: {type: string, description: Absolute CDN URL or path relative to API origin}
        bestScore: {type: integer, minimum: 0, maximum: 100}
        completed: {type: boolean}
    VocabularyExample:
      type: object
      required: [japanese, reading, meaning]
      properties:
        japanese: {type: string}
        reading: {type: string, description: Full kana reading of the sentence}
        meaning: {type: string}
    VocabularyWord:
      type: object
      required: [id, term, reading, meaning, example, exampleMeaning, note]
      properties:
        id: {type: string}
        term: {type: string}
        reading: {type: string}
        meaning: {type: string}
        example: {type: string, description: Legacy first example}
        exampleMeaning: {type: string}
        examples: {type: array, items: {$ref: '#/components/schemas/VocabularyExample'}}
        note: {type: string}
        imageAsset: {type: string}
        imageUrl: {type: string}
        imagePanel: {type: integer, minimum: 0, maximum: 7, description: Row-major panel in a 4-column by 2-row sheet}
        imageDescription: {type: string}
    VocabularyLesson:
      type: object
      required: [id, level, title, description, bestScore, completed, words]
      properties:
        id: {type: string}
        level: {type: string}
        title: {type: string}
        description: {type: string}
        bestScore: {type: integer}
        completed: {type: boolean}
        imageUrl: {type: string}
        words: {type: array, items: {$ref: '#/components/schemas/VocabularyWord'}}
    VocabularyQuestion:
      type: object
      required: [id, prompt, options]
      properties:
        id: {type: string}
        prompt: {type: string}
        kind: {type: string}
        imageAsset: {type: string}
        imageUrl: {type: string}
        imagePanel: {type: integer, minimum: 0, maximum: 7}
        imageDescription: {type: string}
        options:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
    HomeBanner:
      type: object
      required: [id, title, description, imageUrl, action, buttonLabel, order, enabled]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9-]{0,63}$'}
        title: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 180}
        imageUrl: {type: string, maxLength: 2048, description: HTTPS URL or root-relative bundled/uploaded image URL; empty uses the app illustration}
        action: {type: string, enum: [learn]}
        buttonLabel: {type: string, minLength: 1, maxLength: 40}
        order: {type: integer, minimum: 0, maximum: 999}
        enabled: {type: boolean}
    HomeBannerConfig:
      type: object
      required: [banners]
      properties:
        banners: {type: array, maxItems: 12, items: {$ref: '#/components/schemas/HomeBanner'}}
    Dashboard:
      type: object
      required: [isAuthenticated, dailyGoal, categories, tracks, exams, plans, achievements, banners]
      properties:
        banners: {type: array, items: {$ref: '#/components/schemas/HomeBanner'}, description: Enabled banners sorted by order}
        isAuthenticated: {type: boolean}
        profile: {$ref: '#/components/schemas/Profile'}
        dailyGoal: {$ref: '#/components/schemas/DailyGoal'}
        categories: {type: array, items: {$ref: '#/components/schemas/LearningCategory'}}
        tracks: {type: array, items: {$ref: '#/components/schemas/LearningTrack'}}
        exams: {type: array, items: {$ref: '#/components/schemas/Exam'}}
        plans: {type: array, items: {$ref: '#/components/schemas/Plan'}}
        achievements: {type: array, items: {$ref: '#/components/schemas/Achievement'}}
    Profile:
      type: object
      required: [id, displayName, email, timezone, target, level, xp, streakDays, entitlement]
      properties:
        id: {type: string}
        displayName: {type: string}
        email: {type: string, format: email}
        photoUrl: {type: string, format: uri}
        timezone: {type: string, description: IANA timezone used for study-day boundaries, example: America/Los_Angeles}
        target: {type: string}
        level: {type: integer}
        xp: {type: integer}
        streakDays: {type: integer}
        entitlement:
          type: object
          properties:
            tier: {type: string, enum: [free, premium]}
            isLifetime: {type: boolean}
            expiresAt: {type: string, format: date-time}
    DailyGoal:
      type: object
      required: [minutesLearned, targetMinutes, streakDays]
      properties:
        minutesLearned: {type: integer, minimum: 0}
        targetMinutes: {type: integer, minimum: 0}
        streakDays: {type: integer, minimum: 0}
    LearningCategory:
      type: object
      required: [id, name, description, lessonCount, requiredTier]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        lessonCount: {type: integer}
        requiredTier: {type: string, enum: [free, premium]}
    LearningTrack:
      type: object
      required: [id, system, level, title, description, progress, requiredTier]
      properties:
        id: {type: string}
        system: {type: string}
        level: {type: string}
        title: {type: string}
        description: {type: string}
        progress: {type: integer, minimum: 0, maximum: 100}
        requiredTier: {type: string, enum: [free, premium]}
    Exam:
      type: object
      properties:
        id: {type: string}
        system: {type: string}
        level: {type: string}
        title: {type: string}
        questionCount: {type: integer}
        durationMinutes: {type: integer}
        requiredTier: {type: string, enum: [free, premium]}
    Plan:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        billingType: {type: string, enum: [free, monthly, yearly, lifetime]}
        priceIdr: {type: integer}
        features: {type: array, items: {type: string}}
        recommended: {type: boolean}
    PricingConfig:
      type: object
      required: [lifetimePriceIdr]
      properties:
        lifetimePriceIdr: {type: integer, minimum: 1000, maximum: 100000000, example: 149000}
    GamificationSummary:
      type: object
      required: [xp, level, levelXp, nextLevelXp, streakDays, bestStreak, lessonsCompleted, examsCompleted, activeDays, minutesToday, timezone, achievements]
      properties:
        xp: {type: integer, minimum: 0}
        level: {type: integer, minimum: 1}
        levelXp: {type: integer, minimum: 0, maximum: 499}
        nextLevelXp: {type: integer, const: 500}
        streakDays: {type: integer, minimum: 0}
        bestStreak: {type: integer, minimum: 0}
        lessonsCompleted: {type: integer, minimum: 0}
        examsCompleted: {type: integer, minimum: 0, description: Distinct exam IDs completed with at least one answer}
        activeDays: {type: integer, minimum: 0}
        minutesToday: {type: integer, minimum: 0, description: Capped server duration of completed quiz or exam sessions}
        timezone: {type: string, description: IANA timezone used for study-day boundaries, example: Europe/Paris}
        achievements: {type: array, items: {$ref: '#/components/schemas/Achievement'}}
    Achievement:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        icon: {type: string}
        progress: {type: integer}
        target: {type: integer}
        unlockedAt: {type: string, format: date-time}
    CategoriesResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/LearningCategory'}}
    TracksResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/LearningTrack'}}
    ExamsResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Exam'}}
    PlansResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Plan'}}
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
